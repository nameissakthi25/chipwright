name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[llm]'   # tokenizers/onnxruntime — so the real-library llm tests run (not skip)
          pip install pytest

      - name: Run tests
        run: pytest -q

  cleanroom:
    name: clean-room install (a stranger can install + run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the wheel and sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: twine check (metadata is publishable)
        run: python -m twine check dist/*

      - name: Install the built wheel in an isolated venv (no repo on path)
        run: |
          python -m venv /tmp/cw && /tmp/cw/bin/pip install --upgrade pip
          /tmp/cw/bin/pip install dist/*.whl

      - name: Use it with NONE of the author's assets (run from /tmp, repo not importable)
        run: |
          cd /tmp
          /tmp/cw/bin/chipwright --help
          /tmp/cw/bin/chipwright list
          # smoke the hosted model: resolves to USE (exit 0). BUILD/FAIL return non-zero by design,
          # so a build-only model here would fail the step under `bash -e`.
          /tmp/cw/bin/chipwright --target htpv68,qnn2.38 resolve mobilenet-v2
