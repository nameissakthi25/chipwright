# How mobilenet-v2 was actually built for v68 — a reproducible recipe (the input to a verified build).
name: mobilenet-v2
version: 1.0.0
route: dlc_route            # ship the durable DLC; the context binary is regenerated on-board
source:
  format: onnx
  url: https://huggingface.co/qualcomm/MobileNet-v2   # w8a16 ONNX export (encodings embedded)
  sha256: ""               # fill on publish
target:
  arch: v68
  quant: w8a16
  shape: img224
  sdk_range: ">=2.34,<2.40"
adaptations: []            # none needed — the export is already static-shape, encodings embedded
quant:
  weights: 8
  activations: 16
  bias: 32
  per_channel: false
  calibration_ref: embedded   # the w8a16 ONNX carries its own QDQ encodings
  algorithm: qdq
host:
  pre: cv:preprocess     # image -> [1,3,224,224] in [0,1]
  post: cv:logits
  deps: [onnxruntime, numpy, pillow]
graphs:
  - id: classifier
    runs_on: npu
