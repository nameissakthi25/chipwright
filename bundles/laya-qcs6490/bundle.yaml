name: laya-qcs6490
model: convaiinnovations/laya
model_license: apache-2.0        # compiled artifacts inherit the source-model license (OK to host)
task: typed-decision
backend: qualcomm
device: qcs6490
soc_arch: v68                    # Hexagon HTP arch — part of artifact identity, not just the SoC name
precision: w8a16
toolchain:
  qairt: "2.37.1.250807"         # the SDK the artifacts were BUILT + VERIFIED against
# Durability (see RESEARCH.md §1): the DLC is forward-compatible; the HTP context binary is pinned to
# (soc_arch x qairt version x backend lib) and can break on a QAIRT minor bump. The runtime provisions
# the context binary from the DLC on the board, so a device QAIRT bump regenerates rather than bricks.
min_runtime:
  qairt: "2.37"                  # consumer runtime must be >= this (DLC forward-compat); else refuse/fallback

# Pulled + sha256-verified by the runtime (fetch.py). Not vendored into git.
artifacts:
  - id: encoder_ctx            # 256-token sqnr HTP context binary (the headline path)
    url: https://huggingface.co/nameissakthi/laya-qcs6490-encoder/resolve/main/ctx/laya_encoder_256_sqnr_ctx.bin
    sha256: b338a4067e9d9d3147aa8e016892450e51018de6db425ef2e3a4e533a4548a54
    size: 351895552
  - id: encoder_ctx_128        # 128-token min-max (near-lossless; shorter/faster)
    url: https://huggingface.co/nameissakthi/laya-qcs6490-encoder/resolve/main/ctx/laya_encoder_mm_ctx.bin
    sha256: 7ad7311f46786e0066fcedea94ef8c35262fa64df4693be1096b59b66ddb7c75
    size: 350019584
  - id: mask_256
    url: https://huggingface.co/nameissakthi/laya-qcs6490-encoder/resolve/main/mask_only_256.onnx
    sha256: 9525022efa3af6f13b850bd098f32e88bf3a1552faec245aeaa390a91896fc74
    size: 536372
  - id: mask_128
    url: https://huggingface.co/nameissakthi/laya-qcs6490-encoder/resolve/main/mask_only_128.onnx
    sha256: 0b41f66df0650fd0964b91a590ebc57f9f3a8673885d0b773610a92ce5a13371
    size: 141108

graphs:
  - id: encoder
    runs_on: npu
    artifact: encoder_ctx          # default 256; swap to encoder_ctx_128 for the short path
    board_ctx: /home/denc/ctx256s/laya_encoder_256_sqnr_ctx.bin   # path on the board (provisioned from artifact)
    context_len: 256
    inputs:  [inputs_embeds, gmask, smask]
    outputs:
      - { name: hidden, dtype: float32, shape: [256, 1024] }      # final-LayerNorm hidden states

host:
  # text + question -> (inputs_embeds, gmask, smask) ; hidden -> calibrated typed decision
  pre:  { module: host, fn: encode_inputs }
  post: { module: host, fn: decode_outputs }
  deps: ["laya", "onnxruntime", "torch", "numpy", "pyyaml"]

# Device connection (QCS6490 reached over the LAN from the host that runs the bundle).
device_access:
  transport: ssh
  host_env: LAYA_BOARD_HOST        # e.g. 192.168.31.41
  user_env: LAYA_BOARD_USER        # e.g. root
  pass_env: LAYA_BOARD_PASS
  board_dir: /home/denc

entrypoint:
  module: runtime.run
  args: ["--bundle", "."]

metrics:
  verified_on: physical-qcs6490
  fidelity:
    kind: hidden_state_pearson
    markers: 0.82
    all_tokens: 0.88
  latency_ms_per_decision: 84
  energy_j_per_decision: 0.5
  notes: "@256 sqnr. Phishing AUROC on PhishNChips is length-confounded (length-alone 0.76); judge fidelity on hidden states. See bench.json."
