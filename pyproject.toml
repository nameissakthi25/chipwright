[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chipwright"
version = "0.2.1"
description = "A verified package manager for Qualcomm NPUs — resolve the artifact that loads on your exact chip, run it, and prove it against a CPU reference."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["npu", "qualcomm", "hexagon", "qnn", "edge-ai", "quantization", "inference", "package-manager"]
# Pure-Python runtime deps. NOTE: `run` also needs the `sshpass` SYSTEM binary (not a pip package)
# to reach a board over SSH — `apt-get install sshpass` / `brew install hudochenkov/sshpass/sshpass`.
# Its absence is reported by name at run time (see chipwright/device.py::_require_sshpass).
dependencies = ["pyyaml>=6", "numpy>=1.24"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Build Tools",
]

[project.optional-dependencies]
# Per-modality runners (frontend + decoders / reference). Installed by extra.
asr = ["onnxruntime>=1.16"]   # streaming encoder/decoder/joiner
cv  = ["onnxruntime>=1.16", "pillow>=10"]   # image classifiers
tts = ["onnxruntime>=1.16"]
llm = ["onnxruntime>=1.16", "tokenizers>=0.19"]   # CPU-reference decoder (llm_reference.py) + retokenize genie text→ids (modalities/llm.py)
eval = ["qai-hub-models>=4.5"]   # reference-side WikiText PPL / MMLU via qai-hub's eval harness (task_eval.py)
build = ["onnx>=1.14"]        # op pre-check for the build verb
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/nameissakthi25/chipwright"
Specification = "https://github.com/nameissakthi25/chipwright-speckit"

[project.scripts]
chipwright = "chipwright.cli:main"

[tool.setuptools]
packages = ["chipwright", "chipwright.modalities", "chipwright.tests"]

[tool.setuptools.package-data]
# The portable public registry index ships inside the package (see registry.py::DEFAULT_INDEX).
chipwright = ["data/*.yaml"]
